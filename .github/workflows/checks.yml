name: Profile checks

on:
  push:
    paths:
      - "README.md"
      - "PROFILE.md"
      - ".gitattributes"
      - ".gitignore"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned image and timezone dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate public-data, renderer and workflow contracts
        run: python -B -m unittest discover -s tests
      - name: Verify two offline builds are exact no-ops
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_profile.py --offline
          git diff --exit-code -- README.md assets data
          python -B scripts/build_profile.py --offline
          git diff --exit-code -- README.md assets data
