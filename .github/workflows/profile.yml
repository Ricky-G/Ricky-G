name: Profile refresh

on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Pacific/Auckland"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned image and timezone dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run local contracts
        run: python -B -m unittest discover -s tests
      - name: Preserve the previous valid snake
        run: |
          cp assets/generated/snake-light.svg "$RUNNER_TEMP/snake-light.svg"
          cp assets/generated/snake-dark.svg "$RUNNER_TEMP/snake-dark.svg"
      - name: Generate the contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Ricky-G
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/generated/snake-light.svg?color_snake=#d97706&color_dots=#eef0f8,#a7f3d0,#5eead4,#a78bfa,#d946ef
            assets/generated/snake-dark.svg?color_snake=#fbbf24&color_dots=#161b2e,#0f5a45,#14a38a,#8b6cf0,#e879f9
      - name: Retain the snake if its provider failed
        if: steps.snake.outcome == 'failure'
        run: |
          cp "$RUNNER_TEMP/snake-light.svg" assets/generated/snake-light.svg
          cp "$RUNNER_TEMP/snake-dark.svg" assets/generated/snake-dark.svg
          echo "::warning::Snake refresh failed; the previous valid images are retained."
          echo "Snake refresh failed; previous valid images retained." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate public readiness and render the profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/build_profile.py --preserve-snake
      - name: Publish only changed profile data and images
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          baseline="$(git rev-parse HEAD)"
          git add -- README.md assets data
          if git diff --cached --quiet; then
            echo "Verified inputs produced a no-op; no commit created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          live="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$live" != "$baseline" ]; then
            echo "::error::The profile branch changed during this run. Stop; do not overwrite owner edits."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "profile: refresh verified public snapshots"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "Profile refreshed from validated public data." >> "$GITHUB_STEP_SUMMARY"
