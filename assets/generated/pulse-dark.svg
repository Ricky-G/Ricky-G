<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" id="motion" class="pud" role="img" aria-label="GitHub activity: 1,235 contributions in the last year."><title>GitHub activity: 1,235 contributions in the last year.</title><style>
.pud text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
