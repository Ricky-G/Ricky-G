.pud .fl1{animation:pud-float 6s ease-in-out infinite}
.pud .fl2{animation:pud-float 7s ease-in-out infinite 1.4s}
.pud .fl3{animation:pud-float 6.5s ease-in-out infinite .7s}
.pud .in{animation:pud-in .7s cubic-bezier(.2,.8,.2,1) both}
.pud .grow{transform-box:fill-box;transform-origin:0 50%;animation:pud-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.pud:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.pud:not(:target) *{animation:none!important}}
