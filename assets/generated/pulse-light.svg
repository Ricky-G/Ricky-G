<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" id="motion" class="pul" role="img" aria-label="Pulse: 1,227 contributions in the last year."><title>Pulse: 1,227 contributions in the last year.</title><style>
