<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" id="motion" class="sod" role="img" aria-label="Off the clock? I&#x27;m still building AI and AI agents, exploring emerging tech, and chasing far too many side projects. I love meeting founders and building crazy, impossible ideas together, so if that&#x27;s you, let&#x27;s talk."><title>Off the clock? I&#x27;m still building AI and AI agents, exploring emerging tech, and chasing far too many side projects. I love meeting founders and building crazy, impossible ideas together, so if that&#x27;s you, let&#x27;s talk.</title><style>
.sod text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.sod .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes sod-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes sod-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sod-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes sod-spin{to{transform:rotate(360deg)}}
@keyframes sod-spinr{to{transform:rotate(-360deg)}}
@keyframes sod-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes sod-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sod-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sod-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.sod .t1{animation:sod-tw 3.4s ease-in-out infinite}
.sod .t2{animation:sod-tw 4.8s ease-in-out infinite 1.1s}
.sod .t3{animation:sod-tw 6.2s ease-in-out infinite 2.3s}
.sod .ping{animation:sod-ping 2.6s ease-out infinite}
.sod .blink{animation:sod-blink 1.1s steps(1) infinite}
.sod .fl1{animation:sod-float 6s ease-in-out infinite}
.sod .fl2{animation:sod-float 7s ease-in-out infinite 1.4s}
.sod .fl3{animation:sod-float 6.5s ease-in-out infinite .7s}
.sod .in{animation:sod-in .7s cubic-bezier(.2,.8,.2,1) both}
.sod .grow{transform-box:fill-box;transform-origin:0 50%;animation:sod-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.sod:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.sod:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="sod-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="sod-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="sod-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#121a37"/><stop offset="1" style="stop-color:#0b1128"/></linearGradient><filter id="sod-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#000000;flood-opacity:0.45"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="sod-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="sod-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="sod-c"><rect x="7" y="7" width="1186" height="396" rx="24"/></clipPath></defs><rect x="7" y="7" width="1186" height="396" rx="24" style="fill:url(#sod-card);stroke:#252f55;stroke-width:1.4"/><g clip-path="url(#sod-c)"><circle cx="1150" cy="230" r="170" filter="url(#sod-blur)" style="fill:#8b5cf6;opacity:0.30"/><circle cx="900" cy="0" r="120" filter="url(#sod-blur)" style="fill:#34d399;opacity:0.30"/></g><circle cx="49" cy="55.5" r="4.4" style="fill:#e879f9"/><text x="64.0" y="61.0" class="m" data-font-role="kicker" style="font-size:21px;fill:#8a93b7;font-weight:700;letter-spacing:1.2px">OFF THE CLOCK</text><text x="42.0" y="121.0" data-font-role="signoff-title" style="font-size:43px;fill:#eef1ff;font-weight:800;letter-spacing:-0.6px">Still building. Let&#x27;s make something.</text><text x="44.0" y="179.0" data-font-role="signoff-body" style="font-size:26px;fill:#bdc5e4;font-weight:400">I&#x27;m still building AI and AI agents, exploring emerging tech, and chasing far too many</text><text x="44.0" y="217.0" data-font-role="signoff-body" style="font-size:26px;fill:#bdc5e4;font-weight:400">side projects. I love meeting founders and building crazy, impossible ideas together,</text><text x="44.0" y="255.0" data-font-role="signoff-body" style="font-size:26px;fill:#bdc5e4;font-weight:400">so if that&#x27;s you, let&#x27;s talk.</text><text x="1156" y="353" text-anchor="end" style="font-size:70px;font-weight:800;letter-spacing:-2.4px;fill:#eef1ff">ricky <tspan style="fill:url(#sod-shim)">g.</tspan></text><text x="44.0" y="330.0" class="m" data-font-role="signoff-meta" style="font-size:20px;fill:#8a93b7;font-weight:400">Auckland, New Zealand</text></svg>