<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 932" width="600" height="932" id="motion" class="sopl" role="img" aria-label="Off the clock? I&#x27;m still building AI and AI agents, exploring emerging tech, and chasing far too many side projects. I love meeting founders and building crazy, impossible ideas together, so if that&#x27;s you, let&#x27;s talk."><title>Off the clock? I&#x27;m still building AI and AI agents, exploring emerging tech, and chasing far too many side projects. I love meeting founders and building crazy, impossible ideas together, so if that&#x27;s you, let&#x27;s talk.</title><style>
.sopl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.sopl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes sopl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes sopl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sopl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes sopl-spin{to{transform:rotate(360deg)}}
@keyframes sopl-spinr{to{transform:rotate(-360deg)}}
@keyframes sopl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes sopl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sopl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sopl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.sopl .t1{animation:sopl-tw 3.4s ease-in-out infinite}
.sopl .t2{animation:sopl-tw 4.8s ease-in-out infinite 1.1s}
.sopl .t3{animation:sopl-tw 6.2s ease-in-out infinite 2.3s}
.sopl .ping{animation:sopl-ping 2.6s ease-out infinite}
.sopl .blink{animation:sopl-blink 1.1s steps(1) infinite}
.sopl .fl1{animation:sopl-float 6s ease-in-out infinite}
.sopl .fl2{animation:sopl-float 7s ease-in-out infinite 1.4s}
.sopl .fl3{animation:sopl-float 6.5s ease-in-out infinite .7s}
.sopl .in{animation:sopl-in .7s cubic-bezier(.2,.8,.2,1) both}
.sopl .grow{transform-box:fill-box;transform-origin:0 50%;animation:sopl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.sopl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.sopl:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="sopl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="sopl-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="sopl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#f7f8fe"/></linearGradient><filter id="sopl-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#1e2a5a;flood-opacity:0.13"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="sopl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="sopl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect x="7" y="7" width="586" height="918" rx="24" style="fill:url(#sopl-card);stroke:#e2e6f3;stroke-width:1.4"/><circle cx="39" cy="61.5" r="4.4" style="fill:#c026d3"/><text x="54.0" y="67.0" class="m" data-font-role="kicker" style="font-size:32px;fill:#666f8e;font-weight:700;letter-spacing:1.2px">OFF THE CLOCK</text><text x="32.0" y="143.0" data-font-role="signoff-title" style="font-size:52px;fill:#0b1020;font-weight:800;letter-spacing:-0.4px">Still building. Let&#x27;s</text><text x="32.0" y="208.0" data-font-role="signoff-title" style="font-size:52px;fill:#0b1020;font-weight:800;letter-spacing:-0.4px">make something.</text><text x="34.0" y="289.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">I&#x27;m still building AI and AI</text><text x="34.0" y="342.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">agents, exploring</text><text x="34.0" y="395.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">emerging tech, and</text><text x="34.0" y="448.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">chasing far too many side</text><text x="34.0" y="501.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">projects. I love meeting</text><text x="34.0" y="554.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">founders and building</text><text x="34.0" y="607.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">crazy, impossible ideas</text><text x="34.0" y="660.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">together, so if that&#x27;s you,</text><text x="34.0" y="713.0" data-font-role="signoff-body" style="font-size:40px;fill:#394262;font-weight:400">let&#x27;s talk.</text><text x="34.0" y="806.0" style="font-size:60px;fill:url(#sopl-brand);font-weight:800;letter-spacing:-1.5px">ricky g.</text><text x="34.0" y="867.0" data-font-role="signoff-meta" style="font-size:32px;fill:#666f8e;font-weight:400">Auckland, New Zealand</text></svg>