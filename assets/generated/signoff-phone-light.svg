<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" id="motion" class="sopl" role="img" aria-label="Still building. Founders with impossible ideas: let&#x27;s talk."><title>Still building. Founders with impossible ideas: let&#x27;s talk.</title><style>
.sopl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.sopl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes sopl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes sopl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sopl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes sopl-spin{to{transform:rotate(360deg)}}
@keyframes sopl-spinr{to{transform:rotate(-360deg)}}
@keyframes sopl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes sopl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sopl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sopl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.sopl .t1{animation:sopl-tw 3.4s ease-in-out infinite}
.sopl .t2{animation:sopl-tw 4.8s ease-in-out infinite 1.1s}
.sopl .t3{animation:sopl-tw 6.2s ease-in-out infinite 2.3s}
.sopl .ping{animation:sopl-ping 2.6s ease-out infinite}
.sopl .blink{animation:sopl-blink 1.1s steps(1) infinite}
.sopl .fl1{animation:sopl-float 6s ease-in-out infinite}
.sopl .fl2{animation:sopl-float 7s ease-in-out infinite 1.4s}
.sopl .fl3{animation:sopl-float 6.5s ease-in-out infinite .7s}
.sopl .in{animation:sopl-in .7s cubic-bezier(.2,.8,.2,1) both}
.sopl .grow{transform-box:fill-box;transform-origin:0 50%;animation:sopl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.sopl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.sopl:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="sopl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="sopl-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="sopl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#f7f8fe"/></linearGradient><filter id="sopl-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#1e2a5a;flood-opacity:0.13"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="sopl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="sopl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect x="7" y="7" width="586" height="526" rx="24" style="fill:url(#sopl-card);stroke:#e2e6f3;stroke-width:1.4"/><circle cx="39" cy="53.5" r="4.4" style="fill:#c026d3"/><text x="51.0" y="58.0" class="m" style="font-size:12.5px;fill:#666f8e;font-weight:700;letter-spacing:1.8px">OFF THE CLOCK</text><text x="32.0" y="115.0" style="font-size:39px;fill:#0b1020;font-weight:800;letter-spacing:-0.4px">Still building. Let&#x27;s make</text><text x="32.0" y="164.0" style="font-size:39px;fill:#0b1020;font-weight:800;letter-spacing:-0.4px">something.</text><text x="34.0" y="229.0" style="font-size:24px;fill:#394262;font-weight:400">I&#x27;m still building AI and AI agents, exploring</text><text x="34.0" y="262.0" style="font-size:24px;fill:#394262;font-weight:400">emerging tech, and chasing far too many</text><text x="34.0" y="295.0" style="font-size:24px;fill:#394262;font-weight:400">side projects. Founders with crazy,</text><text x="34.0" y="328.0" style="font-size:24px;fill:#394262;font-weight:400">impossible ideas: let&#x27;s talk.</text><text x="34.0" y="452.0" style="font-size:47px;fill:url(#sopl-brand);font-weight:800;letter-spacing:-1.5px">ricky g.</text><text x="34.0" y="493.0" style="font-size:19px;fill:#666f8e;font-weight:400">Auckland, NZ · snapshot 8 Nov 2026, 15:06 NZDT</text></svg>