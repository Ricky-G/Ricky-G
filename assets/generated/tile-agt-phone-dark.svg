.tapd .fl2{animation:tapd-float 7s ease-in-out infinite 1.4s}
.tapd .fl3{animation:tapd-float 6.5s ease-in-out infinite .7s}
.tapd .in{animation:tapd-in .7s cubic-bezier(.2,.8,.2,1) both}
.tapd .grow{transform-box:fill-box;transform-origin:0 50%;animation:tapd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
