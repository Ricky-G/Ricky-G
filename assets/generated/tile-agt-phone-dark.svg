<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1278" width="600" height="1278" id="motion" class="tapd" role="img" aria-label="Agent Governance Toolkit: policy enforcement, zero-trust identity and audit."><title>Agent Governance Toolkit: policy enforcement, zero-trust identity and audit.</title><style>
.tapd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
