<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" id="motion" class="thd" role="img" aria-label="Azure Scenario Hub: tested Azure and Microsoft AI scenarios, with a real APIM benchmark."><title>Azure Scenario Hub: tested Azure and Microsoft AI scenarios, with a real APIM benchmark.</title><style>
.thd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.thd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes thd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes thd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes thd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes thd-spin{to{transform:rotate(360deg)}}
@keyframes thd-spinr{to{transform:rotate(-360deg)}}
@keyframes thd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes thd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes thd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes thd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.thd .t1{animation:thd-tw 3.4s ease-in-out infinite}
.thd .t2{animation:thd-tw 4.8s ease-in-out infinite 1.1s}
.thd .t3{animation:thd-tw 6.2s ease-in-out infinite 2.3s}
.thd .ping{animation:thd-ping 2.6s ease-out infinite}
.thd .blink{animation:thd-blink 1.1s steps(1) infinite}
.thd .fl1{animation:thd-float 6s ease-in-out infinite}
.thd .fl2{animation:thd-float 7s ease-in-out infinite 1.4s}
.thd .fl3{animation:thd-float 6.5s ease-in-out infinite .7s}
.thd .in{animation:thd-in .7s cubic-bezier(.2,.8,.2,1) both}
.thd .grow{transform-box:fill-box;transform-origin:0 50%;animation:thd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.thd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.thd:not(:target) *{animation:none!important}}
