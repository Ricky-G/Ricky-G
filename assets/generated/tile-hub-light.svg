<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550" id="motion" class="thl" role="img" aria-label="Azure Scenario Hub: tested Azure and Microsoft AI scenarios, with a real APIM benchmark."><title>Azure Scenario Hub: tested Azure and Microsoft AI scenarios, with a real APIM benchmark.</title><style>
.thl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.thl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes thl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes thl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes thl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes thl-spin{to{transform:rotate(360deg)}}
@keyframes thl-spinr{to{transform:rotate(-360deg)}}
@keyframes thl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes thl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes thl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes thl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.thl .t1{animation:thl-tw 3.4s ease-in-out infinite}
.thl .t2{animation:thl-tw 4.8s ease-in-out infinite 1.1s}
.thl .t3{animation:thl-tw 6.2s ease-in-out infinite 2.3s}
.thl .ping{animation:thl-ping 2.6s ease-out infinite}
.thl .blink{animation:thl-blink 1.1s steps(1) infinite}
.thl .fl1{animation:thl-float 6s ease-in-out infinite}
.thl .fl2{animation:thl-float 7s ease-in-out infinite 1.4s}
.thl .fl3{animation:thl-float 6.5s ease-in-out infinite .7s}
.thl .in{animation:thl-in .7s cubic-bezier(.2,.8,.2,1) both}
.thl .grow{transform-box:fill-box;transform-origin:0 50%;animation:thl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.thl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.thl:not(:target) *{animation:none!important}}
