@keyframes ind-spinr{to{transform:rotate(-360deg)}}
@keyframes ind-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes ind-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ind-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ind-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.ind .t1{animation:ind-tw 3.4s ease-in-out infinite}
.ind .t2{animation:ind-tw 4.8s ease-in-out infinite 1.1s}
.ind .t3{animation:ind-tw 6.2s ease-in-out infinite 2.3s}
.ind .ping{animation:ind-ping 2.6s ease-out infinite}
.ind .blink{animation:ind-blink 1.1s steps(1) infinite}
.ind .fl1{animation:ind-float 6s ease-in-out infinite}
.ind .fl2{animation:ind-float 7s ease-in-out infinite 1.4s}
.ind .fl3{animation:ind-float 6.5s ease-in-out infinite .7s}
.ind .in{animation:ind-in .7s cubic-bezier(.2,.8,.2,1) both}
.ind .grow{transform-box:fill-box;transform-origin:0 50%;animation:ind-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.ind:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.ind:not(:target) *{animation:none!important}}
