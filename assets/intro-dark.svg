<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528" id="motion" class="ind" role="img" aria-label="Engineer at heart. I design cloud architectures, build AI systems you can trust, and create developer platforms that accelerate delivery. I write about the journey on my blog. About me. I&#x27;m an engineer from Auckland, passionate about cloud, AI, and startups. I build scalable systems, govern AI agents, and obsess over developer experience, turning gnarly architecture into things that actually ship."><title>Engineer at heart. I design cloud architectures, build AI systems you can trust, and create developer platforms that accelerate delivery. I write about the journey on my blog. About me. I&#x27;m an engineer from Auckland, passionate about cloud, AI, and startups. I build scalable systems, govern AI agents, and obsess over developer experience, turning gnarly architecture into things that actually ship.</title><style>
.ind text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.ind .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes ind-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes ind-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ind-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
