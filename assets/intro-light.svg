.inl .t1{animation:inl-tw 3.4s ease-in-out infinite}
.inl .t2{animation:inl-tw 4.8s ease-in-out infinite 1.1s}
.inl .t3{animation:inl-tw 6.2s ease-in-out infinite 2.3s}
.inl .ping{animation:inl-ping 2.6s ease-out infinite}
.inl .blink{animation:inl-blink 1.1s steps(1) infinite}
.inl .fl1{animation:inl-float 6s ease-in-out infinite}
.inl .fl2{animation:inl-float 7s ease-in-out infinite 1.4s}
.inl .fl3{animation:inl-float 6.5s ease-in-out infinite .7s}
.inl .in{animation:inl-in .7s cubic-bezier(.2,.8,.2,1) both}
.inl .grow{transform-box:fill-box;transform-origin:0 50%;animation:inl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.inl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.inl:not(:target) *{animation:none!important}}
