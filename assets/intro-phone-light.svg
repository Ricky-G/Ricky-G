<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1501" width="400" height="1501" id="motion" class="inpl" role="img" aria-label="Engineer at heart. I design cloud architectures, build AI systems you can trust, and create developer platforms that accelerate delivery. I write about the journey on my blog. About me. I&#x27;m an engineer from Auckland, passionate about cloud, AI, and startups. I build scalable systems, govern AI agents, and obsess over developer experience, turning gnarly architecture into things that actually ship."><title>Engineer at heart. I design cloud architectures, build AI systems you can trust, and create developer platforms that accelerate delivery. I write about the journey on my blog. About me. I&#x27;m an engineer from Auckland, passionate about cloud, AI, and startups. I build scalable systems, govern AI agents, and obsess over developer experience, turning gnarly architecture into things that actually ship.</title><style>
.inpl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.inpl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes inpl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes inpl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes inpl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes inpl-spin{to{transform:rotate(360deg)}}
@keyframes inpl-spinr{to{transform:rotate(-360deg)}}
@keyframes inpl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes inpl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inpl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes inpl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.inpl .t1{animation:inpl-tw 3.4s ease-in-out infinite}
.inpl .t2{animation:inpl-tw 4.8s ease-in-out infinite 1.1s}
.inpl .t3{animation:inpl-tw 6.2s ease-in-out infinite 2.3s}
.inpl .ping{animation:inpl-ping 2.6s ease-out infinite}
.inpl .blink{animation:inpl-blink 1.1s steps(1) infinite}
.inpl .fl1{animation:inpl-float 6s ease-in-out infinite}
.inpl .fl2{animation:inpl-float 7s ease-in-out infinite 1.4s}
.inpl .fl3{animation:inpl-float 6.5s ease-in-out infinite .7s}
.inpl .in{animation:inpl-in .7s cubic-bezier(.2,.8,.2,1) both}
.inpl .grow{transform-box:fill-box;transform-origin:0 50%;animation:inpl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.inpl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.inpl:not(:target) *{animation:none!important}}
