<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" width="600" height="196" id="motion" class="lapd" role="img" aria-label="Arcade: a little play · a real contribution calendar"><title>Arcade: a little play · a real contribution calendar</title><style>
.lapd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lapd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lapd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lapd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lapd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lapd-spin{to{transform:rotate(360deg)}}
@keyframes lapd-spinr{to{transform:rotate(-360deg)}}
@keyframes lapd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lapd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lapd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lapd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lapd .t1{animation:lapd-tw 3.4s ease-in-out infinite}
.lapd .t2{animation:lapd-tw 4.8s ease-in-out infinite 1.1s}
.lapd .t3{animation:lapd-tw 6.2s ease-in-out infinite 2.3s}
.lapd .ping{animation:lapd-ping 2.6s ease-out infinite}
.lapd .blink{animation:lapd-blink 1.1s steps(1) infinite}
.lapd .fl1{animation:lapd-float 6s ease-in-out infinite}
.lapd .fl2{animation:lapd-float 7s ease-in-out infinite 1.4s}
.lapd .fl3{animation:lapd-float 6.5s ease-in-out infinite .7s}
.lapd .in{animation:lapd-in .7s cubic-bezier(.2,.8,.2,1) both}
.lapd .grow{transform-box:fill-box;transform-origin:0 50%;animation:lapd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lapd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lapd:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="lapd-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lapd-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lapd-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#121a37"/><stop offset="1" style="stop-color:#0b1128"/></linearGradient><filter id="lapd-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#000000;flood-opacity:0.45"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lapd-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lapd-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><text x="14.0" y="60.0" class="m" data-font-role="section-number" style="font-size:34px;fill:url(#lapd-brand);font-weight:700">05</text><text x="86.0" y="63.0" data-font-role="section-title" style="font-size:48px;fill:#eef1ff;font-weight:750">Arcade</text><text x="14.0" y="116.0" class="m" data-font-role="section-meta" style="font-size:32px;fill:#8a93b7;font-weight:400">a little play · a real</text><text x="14.0" y="159.0" class="m" data-font-role="section-meta" style="font-size:32px;fill:#8a93b7;font-weight:400">contribution calendar</text><rect x="14" y="184" width="572" height="2" style="fill:url(#lapd-brand)"/></svg>