<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" width="600" height="196" id="motion" class="lapl" role="img" aria-label="Arcade: a little play · a real contribution calendar"><title>Arcade: a little play · a real contribution calendar</title><style>
.lapl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lapl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lapl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lapl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lapl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lapl-spin{to{transform:rotate(360deg)}}
@keyframes lapl-spinr{to{transform:rotate(-360deg)}}
@keyframes lapl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lapl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lapl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lapl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lapl .t1{animation:lapl-tw 3.4s ease-in-out infinite}
.lapl .t2{animation:lapl-tw 4.8s ease-in-out infinite 1.1s}
.lapl .t3{animation:lapl-tw 6.2s ease-in-out infinite 2.3s}
.lapl .ping{animation:lapl-ping 2.6s ease-out infinite}
.lapl .blink{animation:lapl-blink 1.1s steps(1) infinite}
.lapl .fl1{animation:lapl-float 6s ease-in-out infinite}
.lapl .fl2{animation:lapl-float 7s ease-in-out infinite 1.4s}
.lapl .fl3{animation:lapl-float 6.5s ease-in-out infinite .7s}
.lapl .in{animation:lapl-in .7s cubic-bezier(.2,.8,.2,1) both}
.lapl .grow{transform-box:fill-box;transform-origin:0 50%;animation:lapl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lapl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lapl:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="lapl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lapl-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lapl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#f7f8fe"/></linearGradient><filter id="lapl-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#1e2a5a;flood-opacity:0.13"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lapl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lapl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><text x="14.0" y="60.0" class="m" data-font-role="section-number" style="font-size:34px;fill:url(#lapl-brand);font-weight:700">05</text><text x="86.0" y="63.0" data-font-role="section-title" style="font-size:48px;fill:#0b1020;font-weight:750">Arcade</text><text x="14.0" y="116.0" class="m" data-font-role="section-meta" style="font-size:32px;fill:#666f8e;font-weight:400">a little play · a real</text><text x="14.0" y="159.0" class="m" data-font-role="section-meta" style="font-size:32px;fill:#666f8e;font-weight:400">contribution calendar</text><rect x="14" y="184" width="572" height="2" style="fill:url(#lapl-brand)"/></svg>