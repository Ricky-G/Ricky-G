<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" id="motion" class="lbd" role="img" aria-label="Building: open source · verified GitHub snapshots"><title>Building: open source · verified GitHub snapshots</title><style>
.lbd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lbd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lbd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lbd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lbd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lbd-spin{to{transform:rotate(360deg)}}
@keyframes lbd-spinr{to{transform:rotate(-360deg)}}
@keyframes lbd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lbd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lbd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lbd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lbd .t1{animation:lbd-tw 3.4s ease-in-out infinite}
.lbd .t2{animation:lbd-tw 4.8s ease-in-out infinite 1.1s}
.lbd .t3{animation:lbd-tw 6.2s ease-in-out infinite 2.3s}
.lbd .ping{animation:lbd-ping 2.6s ease-out infinite}
.lbd .blink{animation:lbd-blink 1.1s steps(1) infinite}
.lbd .fl1{animation:lbd-float 6s ease-in-out infinite}
.lbd .fl2{animation:lbd-float 7s ease-in-out infinite 1.4s}
.lbd .fl3{animation:lbd-float 6.5s ease-in-out infinite .7s}
.lbd .in{animation:lbd-in .7s cubic-bezier(.2,.8,.2,1) both}
.lbd .grow{transform-box:fill-box;transform-origin:0 50%;animation:lbd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lbd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lbd:not(:target) *{animation:none!important}}

@keyframes lbd-run{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(1150px);opacity:0}}
.lbd .run{animation:lbd-run 7s cubic-bezier(.45,0,.2,1) infinite}
</style><defs><linearGradient id="lbd-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lbd-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lbd-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#121a37"/><stop offset="1" style="stop-color:#0b1128"/></linearGradient><filter id="lbd-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#000000;flood-opacity:0.45"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lbd-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lbd-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="lbd-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399;stop-opacity:.9"/><stop offset=".4" style="stop-color:#a78bfa;stop-opacity:.55"/><stop offset="1" style="stop-color:#e879f9;stop-opacity:0"/></linearGradient></defs><text x="14.0" y="62.0" class="m" data-font-role="section-number" style="font-size:21px;fill:url(#lbd-brand);font-weight:700">02</text><text x="62.0" y="64.0" data-font-role="section-title" style="font-size:36px;fill:#eef1ff;font-weight:750;letter-spacing:-0.3px">Building</text><text x="1186.0" y="62.0" text-anchor="end" class="m" data-font-role="section-meta" style="font-size:18.5px;fill:#8a93b7;font-weight:400">open source · verified GitHub snapshots</text><rect x="14" y="83" width="1172" height="1.6" style="fill:url(#lbd-line)"/><g class="run"><circle cx="18" cy="83.8" r="7" style="fill:#34d399;opacity:.22"/><circle cx="18" cy="83.8" r="3" style="fill:#34d399"/></g></svg>