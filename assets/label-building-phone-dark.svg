<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" width="600" height="196" id="motion" class="lbpd" role="img" aria-label="Building: open-source projects · what I&#x27;m building"><title>Building: open-source projects · what I&#x27;m building</title><style>
.lbpd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lbpd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lbpd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lbpd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lbpd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lbpd-spin{to{transform:rotate(360deg)}}
@keyframes lbpd-spinr{to{transform:rotate(-360deg)}}
@keyframes lbpd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lbpd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lbpd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lbpd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lbpd .t1{animation:lbpd-tw 3.4s ease-in-out infinite}
.lbpd .t2{animation:lbpd-tw 4.8s ease-in-out infinite 1.1s}
.lbpd .t3{animation:lbpd-tw 6.2s ease-in-out infinite 2.3s}
.lbpd .ping{animation:lbpd-ping 2.6s ease-out infinite}
.lbpd .blink{animation:lbpd-blink 1.1s steps(1) infinite}
.lbpd .fl1{animation:lbpd-float 6s ease-in-out infinite}
.lbpd .fl2{animation:lbpd-float 7s ease-in-out infinite 1.4s}
.lbpd .fl3{animation:lbpd-float 6.5s ease-in-out infinite .7s}
.lbpd .in{animation:lbpd-in .7s cubic-bezier(.2,.8,.2,1) both}
.lbpd .grow{transform-box:fill-box;transform-origin:0 50%;animation:lbpd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lbpd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lbpd:not(:target) *{animation:none!important}}
