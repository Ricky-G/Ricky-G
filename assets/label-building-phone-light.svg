<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" width="600" height="112" id="motion" class="lbpl" role="img" aria-label="Building: open source · verified GitHub snapshots"><title>Building: open source · verified GitHub snapshots</title><style>
.lbpl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lbpl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lbpl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lbpl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lbpl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lbpl-spin{to{transform:rotate(360deg)}}
@keyframes lbpl-spinr{to{transform:rotate(-360deg)}}
@keyframes lbpl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lbpl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lbpl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lbpl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lbpl .t1{animation:lbpl-tw 3.4s ease-in-out infinite}
.lbpl .t2{animation:lbpl-tw 4.8s ease-in-out infinite 1.1s}
.lbpl .t3{animation:lbpl-tw 6.2s ease-in-out infinite 2.3s}
.lbpl .ping{animation:lbpl-ping 2.6s ease-out infinite}
.lbpl .blink{animation:lbpl-blink 1.1s steps(1) infinite}
.lbpl .fl1{animation:lbpl-float 6s ease-in-out infinite}
.lbpl .fl2{animation:lbpl-float 7s ease-in-out infinite 1.4s}
.lbpl .fl3{animation:lbpl-float 6.5s ease-in-out infinite .7s}
.lbpl .in{animation:lbpl-in .7s cubic-bezier(.2,.8,.2,1) both}
.lbpl .grow{transform-box:fill-box;transform-origin:0 50%;animation:lbpl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lbpl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lbpl:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="lbpl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lbpl-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lbpl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#f7f8fe"/></linearGradient><filter id="lbpl-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#1e2a5a;flood-opacity:0.13"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lbpl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lbpl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><text x="14.0" y="44.0" class="m" style="font-size:21px;fill:url(#lbpl-brand);font-weight:700">02</text><text x="58.0" y="46.0" style="font-size:36px;fill:#0b1020;font-weight:750">Building</text><text x="14.0" y="80.0" class="m" style="font-size:19px;fill:#666f8e;font-weight:400">open source · verified GitHub snapshots</text><rect x="14" y="100" width="572" height="2" style="fill:url(#lbpl-brand)"/></svg>