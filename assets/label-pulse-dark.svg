<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 78" width="1200" height="78" id="motion" class="lpd" role="img" aria-label="Pulse: the last 12 months · public activity"><title>Pulse: the last 12 months · public activity</title><style>
.lpd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lpd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lpd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lpd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lpd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lpd-spin{to{transform:rotate(360deg)}}
@keyframes lpd-spinr{to{transform:rotate(-360deg)}}
@keyframes lpd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lpd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lpd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lpd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lpd .t1{animation:lpd-tw 3.4s ease-in-out infinite}
.lpd .t2{animation:lpd-tw 4.8s ease-in-out infinite 1.1s}
.lpd .t3{animation:lpd-tw 6.2s ease-in-out infinite 2.3s}
.lpd .ping{animation:lpd-ping 2.6s ease-out infinite}
.lpd .blink{animation:lpd-blink 1.1s steps(1) infinite}
.lpd .fl1{animation:lpd-float 6s ease-in-out infinite}
.lpd .fl2{animation:lpd-float 7s ease-in-out infinite 1.4s}
.lpd .fl3{animation:lpd-float 6.5s ease-in-out infinite .7s}
.lpd .in{animation:lpd-in .7s cubic-bezier(.2,.8,.2,1) both}
.lpd .grow{transform-box:fill-box;transform-origin:0 50%;animation:lpd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lpd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lpd:not(:target) *{animation:none!important}}

@keyframes lpd-run{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(1150px);opacity:0}}
.lpd .run{animation:lpd-run 7s cubic-bezier(.45,0,.2,1) infinite}
</style><defs><linearGradient id="lpd-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lpd-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#34d399"/><stop offset=".33" style="stop-color:#2dd4bf"/><stop offset=".7" style="stop-color:#a78bfa"/><stop offset="1" style="stop-color:#e879f9"/></linearGradient><linearGradient id="lpd-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#121a37"/><stop offset="1" style="stop-color:#0b1128"/></linearGradient><filter id="lpd-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#000000;flood-opacity:0.45"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lpd-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lpd-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="lpd-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#34d399;stop-opacity:.9"/><stop offset=".4" style="stop-color:#a78bfa;stop-opacity:.55"/><stop offset="1" style="stop-color:#e879f9;stop-opacity:0"/></linearGradient></defs><text x="14.0" y="48.0" class="m" style="font-size:15px;fill:url(#lpd-brand);font-weight:700">04</text><text x="52.0" y="49.0" style="font-size:27px;fill:#eef1ff;font-weight:750;letter-spacing:-0.3px">Pulse</text><text x="1186.0" y="48.0" text-anchor="end" class="m" style="font-size:14px;fill:#8a93b7;font-weight:400">the last 12 months · public activity</text><rect x="14" y="63" width="1172" height="1.6" style="fill:url(#lpd-line)"/><g class="run"><circle cx="18" cy="63.8" r="7" style="fill:#34d399;opacity:.22"/><circle cx="18" cy="63.8" r="3" style="fill:#34d399"/></g></svg>