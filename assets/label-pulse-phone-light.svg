<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" width="600" height="112" id="motion" class="lppl" role="img" aria-label="Pulse: the last 12 months · public activity"><title>Pulse: the last 12 months · public activity</title><style>
.lppl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lppl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lppl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lppl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lppl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lppl-spin{to{transform:rotate(360deg)}}
@keyframes lppl-spinr{to{transform:rotate(-360deg)}}
@keyframes lppl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lppl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lppl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lppl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lppl .t1{animation:lppl-tw 3.4s ease-in-out infinite}
.lppl .t2{animation:lppl-tw 4.8s ease-in-out infinite 1.1s}
.lppl .t3{animation:lppl-tw 6.2s ease-in-out infinite 2.3s}
.lppl .ping{animation:lppl-ping 2.6s ease-out infinite}
.lppl .blink{animation:lppl-blink 1.1s steps(1) infinite}
.lppl .fl1{animation:lppl-float 6s ease-in-out infinite}
.lppl .fl2{animation:lppl-float 7s ease-in-out infinite 1.4s}
.lppl .fl3{animation:lppl-float 6.5s ease-in-out infinite .7s}
.lppl .in{animation:lppl-in .7s cubic-bezier(.2,.8,.2,1) both}
.lppl .grow{transform-box:fill-box;transform-origin:0 50%;animation:lppl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lppl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lppl:not(:target) *{animation:none!important}}
</style><defs><linearGradient id="lppl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lppl-shim" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" style="stop-color:#059669"/><stop offset=".33" style="stop-color:#0d9488"/><stop offset=".7" style="stop-color:#7c3aed"/><stop offset="1" style="stop-color:#c026d3"/></linearGradient><linearGradient id="lppl-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset="1" style="stop-color:#f7f8fe"/></linearGradient><filter id="lppl-shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="6" result="o"/><feFlood style="flood-color:#1e2a5a;flood-opacity:0.13"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lppl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter><filter id="lppl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><text x="14.0" y="44.0" class="m" style="font-size:21px;fill:url(#lppl-brand);font-weight:700">04</text><text x="58.0" y="46.0" style="font-size:36px;fill:#0b1020;font-weight:750">Pulse</text><text x="14.0" y="80.0" class="m" style="font-size:19px;fill:#666f8e;font-weight:400">the last 12 months · public activity</text><rect x="14" y="100" width="572" height="2" style="fill:url(#lppl-brand)"/></svg>