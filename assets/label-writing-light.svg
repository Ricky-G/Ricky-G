<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 78" width="1200" height="78" id="motion" class="lwl" role="img" aria-label="Writing: published on clouddev.blog · latest three"><title>Writing: published on clouddev.blog · latest three</title><style>
.lwl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lwl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lwl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lwl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lwl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lwl-spin{to{transform:rotate(360deg)}}
@keyframes lwl-spinr{to{transform:rotate(-360deg)}}
@keyframes lwl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lwl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lwl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lwl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.lwl .t1{animation:lwl-tw 3.4s ease-in-out infinite}
.lwl .t2{animation:lwl-tw 4.8s ease-in-out infinite 1.1s}
.lwl .t3{animation:lwl-tw 6.2s ease-in-out infinite 2.3s}
.lwl .ping{animation:lwl-ping 2.6s ease-out infinite}
.lwl .blink{animation:lwl-blink 1.1s steps(1) infinite}
.lwl .fl1{animation:lwl-float 6s ease-in-out infinite}
.lwl .fl2{animation:lwl-float 7s ease-in-out infinite 1.4s}
.lwl .fl3{animation:lwl-float 6.5s ease-in-out infinite .7s}
.lwl .in{animation:lwl-in .7s cubic-bezier(.2,.8,.2,1) both}
.lwl .grow{transform-box:fill-box;transform-origin:0 50%;animation:lwl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lwl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lwl:not(:target) *{animation:none!important}}

@keyframes lwl-run{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(1150px);opacity:0}}
.lwl .run{animation:lwl-run 7s cubic-bezier(.45,0,.2,1) infinite}
