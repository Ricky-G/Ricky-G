.lwpd .t1{animation:lwpd-tw 3.4s ease-in-out infinite}
.lwpd .t2{animation:lwpd-tw 4.8s ease-in-out infinite 1.1s}
.lwpd .t3{animation:lwpd-tw 6.2s ease-in-out infinite 2.3s}
.lwpd .ping{animation:lwpd-ping 2.6s ease-out infinite}
.lwpd .blink{animation:lwpd-blink 1.1s steps(1) infinite}
.lwpd .fl1{animation:lwpd-float 6s ease-in-out infinite}
.lwpd .fl2{animation:lwpd-float 7s ease-in-out infinite 1.4s}
.lwpd .fl3{animation:lwpd-float 6.5s ease-in-out infinite .7s}
.lwpd .in{animation:lwpd-in .7s cubic-bezier(.2,.8,.2,1) both}
.lwpd .grow{transform-box:fill-box;transform-origin:0 50%;animation:lwpd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.lwpd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.lwpd:not(:target) *{animation:none!important}}
