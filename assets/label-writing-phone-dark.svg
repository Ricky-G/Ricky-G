<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" width="600" height="112" id="motion" class="lwpd" role="img" aria-label="Writing: published on clouddev.blog · latest three"><title>Writing: published on clouddev.blog · latest three</title><style>
.lwpd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.lwpd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes lwpd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lwpd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lwpd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes lwpd-spin{to{transform:rotate(360deg)}}
@keyframes lwpd-spinr{to{transform:rotate(-360deg)}}
@keyframes lwpd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes lwpd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
