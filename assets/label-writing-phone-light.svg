<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" width="600" height="112" id="motion" class="lwpl" role="img" aria-label="Writing: published on clouddev.blog · latest three"><title>Writing: published on clouddev.blog · latest three</title><style>
