<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" id="motion" class="plbd" role="img" aria-label="clouddev.blog: Read the blog"><title>clouddev.blog: Read the blog</title><style>
.plbd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plbd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plbd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plbd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plbd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plbd-spin{to{transform:rotate(360deg)}}
@keyframes plbd-spinr{to{transform:rotate(-360deg)}}
@keyframes plbd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plbd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plbd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plbd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plbd .t1{animation:plbd-tw 3.4s ease-in-out infinite}
.plbd .t2{animation:plbd-tw 4.8s ease-in-out infinite 1.1s}
.plbd .t3{animation:plbd-tw 6.2s ease-in-out infinite 2.3s}
.plbd .ping{animation:plbd-ping 2.6s ease-out infinite}
.plbd .blink{animation:plbd-blink 1.1s steps(1) infinite}
.plbd .fl1{animation:plbd-float 6s ease-in-out infinite}
.plbd .fl2{animation:plbd-float 7s ease-in-out infinite 1.4s}
.plbd .fl3{animation:plbd-float 6.5s ease-in-out infinite .7s}
.plbd .in{animation:plbd-in .7s cubic-bezier(.2,.8,.2,1) both}
.plbd .grow{transform-box:fill-box;transform-origin:0 50%;animation:plbd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plbd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plbd:not(:target) *{animation:none!important}}
