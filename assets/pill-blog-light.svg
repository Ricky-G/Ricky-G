<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104" width="300" height="104" id="motion" class="plbl" role="img" aria-label="clouddev.blog: Read the blog"><title>clouddev.blog: Read the blog</title><style>
.plbl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plbl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plbl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plbl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plbl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plbl-spin{to{transform:rotate(360deg)}}
@keyframes plbl-spinr{to{transform:rotate(-360deg)}}
@keyframes plbl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plbl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plbl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plbl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plbl .t1{animation:plbl-tw 3.4s ease-in-out infinite}
.plbl .t2{animation:plbl-tw 4.8s ease-in-out infinite 1.1s}
.plbl .t3{animation:plbl-tw 6.2s ease-in-out infinite 2.3s}
.plbl .ping{animation:plbl-ping 2.6s ease-out infinite}
.plbl .blink{animation:plbl-blink 1.1s steps(1) infinite}
.plbl .fl1{animation:plbl-float 6s ease-in-out infinite}
.plbl .fl2{animation:plbl-float 7s ease-in-out infinite 1.4s}
.plbl .fl3{animation:plbl-float 6.5s ease-in-out infinite .7s}
.plbl .in{animation:plbl-in .7s cubic-bezier(.2,.8,.2,1) both}
.plbl .grow{transform-box:fill-box;transform-origin:0 50%;animation:plbl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plbl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plbl:not(:target) *{animation:none!important}}
