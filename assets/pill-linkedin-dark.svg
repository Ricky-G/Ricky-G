<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" id="motion" class="plld" role="img" aria-label="LinkedIn: Let&#x27;s connect"><title>LinkedIn: Let&#x27;s connect</title><style>
.plld text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plld .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plld-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plld-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plld-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plld-spin{to{transform:rotate(360deg)}}
@keyframes plld-spinr{to{transform:rotate(-360deg)}}
@keyframes plld-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plld-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plld-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plld-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plld .t1{animation:plld-tw 3.4s ease-in-out infinite}
.plld .t2{animation:plld-tw 4.8s ease-in-out infinite 1.1s}
.plld .t3{animation:plld-tw 6.2s ease-in-out infinite 2.3s}
.plld .ping{animation:plld-ping 2.6s ease-out infinite}
.plld .blink{animation:plld-blink 1.1s steps(1) infinite}
.plld .fl1{animation:plld-float 6s ease-in-out infinite}
.plld .fl2{animation:plld-float 7s ease-in-out infinite 1.4s}
.plld .fl3{animation:plld-float 6.5s ease-in-out infinite .7s}
.plld .in{animation:plld-in .7s cubic-bezier(.2,.8,.2,1) both}
.plld .grow{transform-box:fill-box;transform-origin:0 50%;animation:plld-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plld:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plld:not(:target) *{animation:none!important}}
