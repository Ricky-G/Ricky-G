ze:20.5px;fill:#eef1ff;font-weight:750">LinkedIn</text><path d="M258 53L269 42M261.5 42H269V49.5" style="fill:none;stroke:#8a93b7;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round"/></svg>