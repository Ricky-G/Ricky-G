<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" id="motion" class="plll" role="img" aria-label="LinkedIn: Let&#x27;s connect"><title>LinkedIn: Let&#x27;s connect</title><style>
.plll text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plll .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plll-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plll-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plll-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plll-spin{to{transform:rotate(360deg)}}
@keyframes plll-spinr{to{transform:rotate(-360deg)}}
@keyframes plll-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plll-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plll-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plll-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plll .t1{animation:plll-tw 3.4s ease-in-out infinite}
.plll .t2{animation:plll-tw 4.8s ease-in-out infinite 1.1s}
.plll .t3{animation:plll-tw 6.2s ease-in-out infinite 2.3s}
.plll .ping{animation:plll-ping 2.6s ease-out infinite}
.plll .blink{animation:plll-blink 1.1s steps(1) infinite}
.plll .fl1{animation:plll-float 6s ease-in-out infinite}
.plll .fl2{animation:plll-float 7s ease-in-out infinite 1.4s}
.plll .fl3{animation:plll-float 6.5s ease-in-out infinite .7s}
.plll .in{animation:plll-in .7s cubic-bezier(.2,.8,.2,1) both}
.plll .grow{transform-box:fill-box;transform-origin:0 50%;animation:plll-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plll:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plll:not(:target) *{animation:none!important}}
