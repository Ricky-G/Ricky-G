<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104" width="300" height="104" id="motion" class="plsd" role="img" aria-label="ricky-g.com: Home base"><title>ricky-g.com: Home base</title><style>
.plsd text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plsd .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plsd-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plsd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plsd-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plsd-spin{to{transform:rotate(360deg)}}
@keyframes plsd-spinr{to{transform:rotate(-360deg)}}
@keyframes plsd-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plsd-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plsd-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plsd-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plsd .t1{animation:plsd-tw 3.4s ease-in-out infinite}
.plsd .t2{animation:plsd-tw 4.8s ease-in-out infinite 1.1s}
.plsd .t3{animation:plsd-tw 6.2s ease-in-out infinite 2.3s}
.plsd .ping{animation:plsd-ping 2.6s ease-out infinite}
.plsd .blink{animation:plsd-blink 1.1s steps(1) infinite}
.plsd .fl1{animation:plsd-float 6s ease-in-out infinite}
.plsd .fl2{animation:plsd-float 7s ease-in-out infinite 1.4s}
.plsd .fl3{animation:plsd-float 6.5s ease-in-out infinite .7s}
.plsd .in{animation:plsd-in .7s cubic-bezier(.2,.8,.2,1) both}
.plsd .grow{transform-box:fill-box;transform-origin:0 50%;animation:plsd-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plsd:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plsd:not(:target) *{animation:none!important}}
