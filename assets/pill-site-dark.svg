ght:700;letter-spacing:0.7px">HOME BASE</text><text x="82.0" y="74.0" data-font-role="pill-title" style="font-size:26px;fill:#eef1ff;font-weight:750">ricky-g.com</text><path d="M272 54L280 46M275.5 46H280V50.5" style="fill:none;stroke:#8a93b7;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round"/></svg>