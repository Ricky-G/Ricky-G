<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" id="motion" class="plsl" role="img" aria-label="ricky-g.com: Home base"><title>ricky-g.com: Home base</title><style>
.plsl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.plsl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes plsl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes plsl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes plsl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes plsl-spin{to{transform:rotate(360deg)}}
@keyframes plsl-spinr{to{transform:rotate(-360deg)}}
@keyframes plsl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes plsl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plsl-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plsl-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.plsl .t1{animation:plsl-tw 3.4s ease-in-out infinite}
.plsl .t2{animation:plsl-tw 4.8s ease-in-out infinite 1.1s}
.plsl .t3{animation:plsl-tw 6.2s ease-in-out infinite 2.3s}
.plsl .ping{animation:plsl-ping 2.6s ease-out infinite}
.plsl .blink{animation:plsl-blink 1.1s steps(1) infinite}
.plsl .fl1{animation:plsl-float 6s ease-in-out infinite}
.plsl .fl2{animation:plsl-float 7s ease-in-out infinite 1.4s}
.plsl .fl3{animation:plsl-float 6.5s ease-in-out infinite .7s}
.plsl .in{animation:plsl-in .7s cubic-bezier(.2,.8,.2,1) both}
.plsl .grow{transform-box:fill-box;transform-origin:0 50%;animation:plsl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.plsl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.plsl:not(:target) *{animation:none!important}}
