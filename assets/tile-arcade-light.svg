.tcl text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.tcl .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes tcl-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes tcl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tcl-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes tcl-spin{to{transform:rotate(360deg)}}
@keyframes tcl-spinr{to{transform:rotate(-360deg)}}
@keyframes tcl-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
