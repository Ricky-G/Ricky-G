.tcl .t1{animation:tcl-tw 3.4s ease-in-out infinite}
.tcl .t2{animation:tcl-tw 4.8s ease-in-out infinite 1.1s}
.tcl .t3{animation:tcl-tw 6.2s ease-in-out infinite 2.3s}
.tcl .ping{animation:tcl-ping 2.6s ease-out infinite}
.tcl .blink{animation:tcl-blink 1.1s steps(1) infinite}
.tcl .fl1{animation:tcl-float 6s ease-in-out infinite}
.tcl .fl2{animation:tcl-float 7s ease-in-out infinite 1.4s}
.tcl .fl3{animation:tcl-float 6.5s ease-in-out infinite .7s}
.tcl .in{animation:tcl-in .7s cubic-bezier(.2,.8,.2,1) both}
.tcl .grow{transform-box:fill-box;transform-origin:0 50%;animation:tcl-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.tcl:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.tcl:not(:target) *{animation:none!important}}

@keyframes tcl-slither{0%{transform:translateX(0)}100%{transform:translateX(158.4px)}}
.tcl .sn{animation:tcl-slither 5s steps(9) infinite}
