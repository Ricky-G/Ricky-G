<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" id="motion" class="tld" role="img" aria-label="ledgerboard: local-first Markdown Kanban for VS Code."><title>ledgerboard: local-first Markdown Kanban for VS Code.</title><style>
.tld text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.tld .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes tld-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes tld-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tld-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes tld-spin{to{transform:rotate(360deg)}}
@keyframes tld-spinr{to{transform:rotate(-360deg)}}
@keyframes tld-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes tld-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tld-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tld-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.tld .t1{animation:tld-tw 3.4s ease-in-out infinite}
.tld .t2{animation:tld-tw 4.8s ease-in-out infinite 1.1s}
.tld .t3{animation:tld-tw 6.2s ease-in-out infinite 2.3s}
.tld .ping{animation:tld-ping 2.6s ease-out infinite}
.tld .blink{animation:tld-blink 1.1s steps(1) infinite}
.tld .fl1{animation:tld-float 6s ease-in-out infinite}
.tld .fl2{animation:tld-float 7s ease-in-out infinite 1.4s}
.tld .fl3{animation:tld-float 6.5s ease-in-out infinite .7s}
.tld .in{animation:tld-in .7s cubic-bezier(.2,.8,.2,1) both}
.tld .grow{transform-box:fill-box;transform-origin:0 50%;animation:tld-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.tld:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.tld:not(:target) *{animation:none!important}}

@keyframes tld-move{0%,30%{transform:translate(0,0)}45%,80%{transform:translate(112px,-2px)}95%,100%{transform:translate(0,0)}}
.tld .mv{animation:tld-move 7s cubic-bezier(.6,0,.2,1) infinite}
