<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" id="motion" class="tll" role="img" aria-label="ledgerboard: local-first Markdown Kanban for VS Code."><title>ledgerboard: local-first Markdown Kanban for VS Code.</title><style>
.tll text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.tll .m{font-family:'Cascadia Code','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes tll-tw{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes tll-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tll-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes tll-spin{to{transform:rotate(360deg)}}
@keyframes tll-spinr{to{transform:rotate(-360deg)}}
@keyframes tll-blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
@keyframes tll-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tll-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tll-travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--d,1000px));opacity:0}}
.tll .t1{animation:tll-tw 3.4s ease-in-out infinite}
.tll .t2{animation:tll-tw 4.8s ease-in-out infinite 1.1s}
.tll .t3{animation:tll-tw 6.2s ease-in-out infinite 2.3s}
.tll .ping{animation:tll-ping 2.6s ease-out infinite}
.tll .blink{animation:tll-blink 1.1s steps(1) infinite}
.tll .fl1{animation:tll-float 6s ease-in-out infinite}
.tll .fl2{animation:tll-float 7s ease-in-out infinite 1.4s}
.tll .fl3{animation:tll-float 6.5s ease-in-out infinite .7s}
.tll .in{animation:tll-in .7s cubic-bezier(.2,.8,.2,1) both}
.tll .grow{transform-box:fill-box;transform-origin:0 50%;animation:tll-grow 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.tll:not(:target) *{animation:none!important}
@media (prefers-reduced-motion:reduce){.tll:not(:target) *{animation:none!important}}

@keyframes tll-move{0%,30%{transform:translate(0,0)}45%,80%{transform:translate(112px,-2px)}95%,100%{transform:translate(0,0)}}
.tll .mv{animation:tll-move 7s cubic-bezier(.6,0,.2,1) infinite}
